    if(action==='close-rental'){let r=activeRental();if(r.paid<r.amount+800+r.charge)return toast('Record the remaining payment before closing this rental.');r.status='Closed';r.step=7;state.equipment.find(e=>e[0]==='EXC-005')[3]='Available';closeDrawer();render();toast('Rental RNT-1048 closed. EXC-005 is available.');return}
    if(action==='pre-inspection'){return openModal('Pre-Rental Inspection · EXC-005',`<div class="detail-grid"><div class="detail-cell"><span>Completed by</span><strong>Rafiq Hassan · 27 Sep · 09:05</strong></div><div class="detail-cell"><span>Hour meter</span><strong>4,812 hrs</strong></div><div class="detail-cell"><span>Hydraulic lines</span><strong>Good</strong></div><div class="detail-cell"><span>Body &amp; tracks</span><strong>Good</strong></div><div class="detail-cell"><span>Fuel</span><strong>82%</strong></div><div class="detail-cell"><span>Photos</span><strong>3 inspection records</strong></div></div><div class="notice-strip">Minor paint scuff on left counterweight. Existing condition acknowledged before dispatch.</div>`,`<button class="btn" data-action="close-modal">Close</button>`)}
    if(action==='journey')return openModal('Al Noor Demo Journey',`<div class="timeline">${['Booking confirmed ✓','EXC-005 allocated ✓','Pre-rental inspection completed ✓','Dispatched to Musaffah Site ✓',`${activeRental().status==='Closed'?'Rental closed ✓':activeRental().returned?'Return inspection ✓':'On Rent — Current'}`,activeRental().extension?'Extension · 2 days ✓':'Extension · 2 days',activeRental().returned?'Return & damage ✓':'Return & inspection',state.maintenance.find(m=>m.id==='MNT-204').status==='Completed'?'Maintenance · completed ✓':'Maintenance · MNT-204',activeRental().paid>=11300?'Payment & close ✓':'Payment & close'].map((x,i)=>`<div class="timeline-entry"><strong>${i+1}. ${x}</strong><div class="secondary">${i===4?'Select the rental to continue from its current stage.':''}</div></div>`).join('')}</div>`,`<button class="btn" data-action="close-modal">Close</button><button class="btn primary" data-action="rental:EXC-005">Open Rental</button>`);
    if(action==='check-availability'){let msg=document.getElementById('availabilityMsg');if(msg)msg.innerHTML='<span class="badge green">Availability checked · no double booking</span>';return toast('Availability checked for the selected period.')}
    if(action==='check-new-booking'){let type=document.getElementById('newType').value;let assets=state.equipment.filter(e=>e[2]===(type.includes('Excavator')?'Excavator':type.includes('Generator')?'Generator':type.includes('Scissor')?'Scissor Lift':'Forklift')&&['Available','On Rent'].includes(e[3]));let node=document.getElementById('allocationResult');node.innerHTML=`<div class="section-title">Available physical assets</div>${assets.map(e=>`<label style="display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);margin-top:6px;border-radius:4px"><input type="radio" name="assetChoice" value="${e[0]}" ${e[0]==='EXC-005'?'checked':''}><strong>${e[0]} · ${e[1]}</strong><span class="secondary" style="margin:0">${e[9].toLocaleString()} operating hours · ${e[4]} · ${badge(e[3])}</span></label>`).join('')||'<div class="notice-strip red">No matching equipment is available for the selected period.</div>'}`;return}
    if(action==='allocate-new-booking'){closeModal();navigate('bookings');toast('Booking RNT-1056 created and physical asset allocated.');return}
    if(action==='add-equipment'||action==='add-customer'||action==='new-enquiry'||action==='maintenance-new'||action==='dispatch-record')return openModal(action==='add-equipment'?'Add Equipment':action==='add-customer'?'Add Customer':action==='new-enquiry'?'New Enquiry':action==='maintenance-new'?'New Maintenance Ticket':'Record Dispatch',`<div class="notice-strip">Demo entry · Changes are held in this browser only.</div><div class="form-grid"><div class="field"><label>Reference</label><input placeholder="e.g. EXC-016"></div><div class="field"><label>Category</label><select><option>Excavator</option><option>Generator</option><option>Forklift</option></select></div><div class="field full"><label>Details</label><input placeholder="Enter a demo record"></div></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="close-modal">Save Demo Record</button>`);
    if(action==='reset'){state=clone(initial);closeDrawer();closeModal();render();toast('Demo data reset to its starting state.');return}
    if(action==='status-filter'){navigate('equipment');return}
    if(action.startsWith('slot:')){let [_,id,date]=action.split(':'),iso=dateISO(date),booking=state.reservations.find(x=>x.asset===id&&iso>=x.start&&iso<=x.end),r=state.rentals.find(x=>x.asset===id&&!x.returned&&x.status!=='Closed'&&iso<=dateISO(x.due)),occupied=!!booking||!!r;let message=booking?`${id} is reserved from ${dateLabel(booking.start)} to ${dateLabel(booking.end)} for ${booking.customer} (${booking.ref}). Choose another asset or period.`:r?`${id} is assigned to ${r.customer} through ${r.due}.`:'';return openModal(occupied?'Availability conflict':`${id} · ${date}`,occupied?`<div class="notice-strip red">${message}</div>`:`<div class="notice-strip">${id} has no booking on ${date}. Available to allocate for this date.</div>`,`<button class="btn" data-action="close-modal">Close</button>${occupied?'':`<button class="btn primary" data-action="new-booking">Create Booking</button>`}`)}if(action.startsWith('ops-tab:')){state.operations.tab=action.split(':')[1];render();return}
    if(action==='reset-demo'){return doAction('reset')}
  }
  document.addEventListener('click',e=>{let t=e.target.closest('[data-action]');if(t){e.preventDefault();doAction(t.dataset.action)}});
  document.getElementById('nav').addEventListener('click',e=>{let t=e.target.closest('[data-view]');if(t)navigate(t.dataset.view)});
  document.getElementById('reset').addEventListener('click',()=>doAction('reset'));
  document.getElementById('mobileMenu').addEventListener('click',()=>{document.getElementById('sidebar').classList.add('mobile-open');document.getElementById('mobileNav').classList.add('open')});document.getElementById('mobileNav').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('mobile-open');document.getElementById('mobileNav').classList.remove('open')});
  document.getElementById('modalClose').addEventListener('click',closeModal);modalWrap.addEventListener('click',e=>{if(e.target===modalWrap)closeModal()});backdrop.addEventListener('click',closeDrawer);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer();document.getElementById('sidebar').classList.remove('mobile-open');document.getElementById('mobileNav').classList.remove('open')}});
  document.addEventListener('input',e=>{if(e.target.id==='extensionDate')extensionPreview();if(e.target.id==='assetSearch'){let q=e.target.value.toLowerCase();document.querySelectorAll('#assetRows tr').forEach(r=>r.hidden=!r.dataset.search.toLowerCase().includes(q))}if(e.target.id==='rentalSearch'||e.target.id==='activeSearch'){let q=e.target.value.toLowerCase();document.querySelectorAll('tbody tr[data-search]').forEach(r=>r.hidden=!r.dataset.search.toLowerCase().includes(q))}});
  document.addEventListener('change',e=>{if(e.target.id==='extensionDate')extensionPreview();if(e.target.id==='activeStatus'){document.querySelectorAll('tbody tr[data-search]').forEach(r=>r.hidden=e.target.value!=='All statuses'&&!r.innerText.includes(e.target.value))}if(e.target.id==='assetStatus'){document.querySelectorAll('#assetRows tr').forEach(r=>r.hidden=e.target.value!=='All statuses'&&!r.children[3].innerText.includes(e.target.value))}});
  render();
})();
</script>
</body>
