<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101e2c">
  <title>Computer Technology CRM · Field Sales & IT Operations</title>
  <style>
    :root {
      --navy: #142535;
      --navy-2: #1b3042;
      --navy-3: #29465a;
      --ink: #172b3b;
      --muted: #738393;
      --quiet: #97a4ae;
      --line: #e7ecef;
      --line-2: #dce4e9;
      --canvas: #f4f7f8;
      --paper: #fff;
      --sea: #168b91;
      --sea-dark: #08737b;
      --sea-pale: #e9f6f5;
      --blue: #4375c5;
      --blue-pale: #edf3fc;
      --green: #25885f;
      --green-pale: #eaf5ef;
      --amber: #aa7424;
      --amber-pale: #fbf3e5;
      --red: #c35b55;
      --red-pale: #fbefed;
      --violet: #7760ad;
      --violet-pale: #f1eef9;
      --shadow: 0 1px 2px rgba(20,37,53,.035), 0 8px 24px rgba(20,37,53,.035);
      --r-sm: 9px;
      --r-md: 13px;
      --r-lg: 18px;
      --unit: 4px;
    }
    * { box-sizing: border-box; }
    html { color-scheme: light; scroll-behavior: smooth; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--canvas); font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(22,139,145,.32); outline-offset: 2px; }
    button:active { transform: scale(.985); }
    .app { min-height: 100vh; }
    .sidebar { position: fixed; z-index: 20; inset: 0 auto 0 0; display: flex; flex-direction: column; width: 254px; padding: 20px 14px 16px; color: #dce7ed; background: var(--navy); }
    .brand { display: flex; gap: 11px; align-items: center; padding: 4px 9px 22px; border-bottom: 1px solid rgba(255,255,255,.09); }
    .brand-mark { display:grid; place-items:center; width:36px;height:36px;border-radius:11px; color:#e8fbfa; background:#1a777b; box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); }
    .brand-mark svg { width:20px;height:20px; }
    .brand-name { font-size:13px; font-weight:700; letter-spacing:-.025em; color:#f6fafb; line-height:1.25; }
    .brand-sub { margin-top:3px; color:#8fa5b3; font-size:10px; letter-spacing:.025em; }
    .workspace { margin: 17px 3px 13px; padding: 11px 10px; display:flex; align-items:center; gap:9px; border:1px solid rgba(255,255,255,.09); border-radius:10px; background:rgba(255,255,255,.035); }
    .workspace-mark { display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:#29485b;color:#a9d8d4;font-size:10px;font-weight:700; }
    .workspace strong { display:block;font-size:11px;color:#ecf3f6;font-weight:600; }
    .workspace span { display:block;color:#8299a8;font-size:10px;margin-top:2px; }
    .nav-label { margin: 12px 9px 7px; color:#748b9a; font-size:9px; text-transform:uppercase; font-weight:700; letter-spacing:.15em; }
    .nav { display:flex; flex-direction:column; gap:2px; }
    .nav-btn { display:flex; align-items:center; gap:11px; width:100%; min-height:38px; padding:0 10px; border:0; border-radius:8px; color:#aebdc7; background:transparent; text-align:left; cursor:pointer; font-size:12px; font-weight:500; transition:background .16s,color .16s; }
    .nav-btn:hover { color:#fff; background:rgba(255,255,255,.06); }
    .nav-btn.active { color:#f4ffff; background:#244353; box-shadow:inset 2px 0 #45b0ac; }
    .nav-btn svg { flex:none;width:16px;height:16px;color:#8097a5; }
    .nav-btn.active svg { color:#8ad1cc; }
    .nav-count { margin-left:auto; min-width:21px; padding:1px 6px; border-radius:20px; text-align:center; color:#f0c782; background:rgba(214,164,84,.13); font-size:10px; font-variant-numeric:tabular-nums; }
    .sidebar-bottom { margin-top:auto; }
    .future-note { padding:12px; border:1px solid rgba(255,255,255,.08); border-radius:11px; background:rgba(255,255,255,.035); }
    .future-note .mini-label { color:#8caaa9; }
    .future-note p { margin:6px 0 0; color:#9eafb9; font-size:10px; line-height:1.55; }
    .user-row { display:flex;align-items:center;gap:9px;margin-top:13px;padding:12px 5px 0;border-top:1px solid rgba(255,255,255,.08); }
    .avatar { display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;color:#226d70;background:#d9eeeb;font-size:10px;font-weight:700; }
    .user-row strong { display:block;color:#eef4f6;font-size:11px;font-weight:600; }
    .user-row span { display:block;color:#8197a5;font-size:10px; }
    .main { min-height:100vh; margin-left:254px; }
    .topbar { position:sticky;z-index:10;top:0;display:flex;align-items:center;justify-content:space-between;min-height:64px;padding:0 34px;border-bottom:1px solid #e9eef0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px); }
    .crumb { display:flex;align-items:center;gap:8px;color:#8a98a3;font-size:11px; }
    .crumb b { color:#334b5c;font-weight:600; }
    .top-actions { display:flex;align-items:center;gap:10px; }
    .searchbox { display:flex;align-items:center;gap:8px;width:228px;height:34px;padding:0 10px;border:1px solid #e6ecef;border-radius:8px;background:#f9fbfb;color:#8b99a4; }
    .searchbox svg { width:15px;height:15px; }
    .searchbox input { min-width:0; width:100%; padding:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:11px; }
    .searchbox input::placeholder { color:#9aa7af; }
    .icon-button { display:grid;place-items:center;position:relative;width:34px;height:34px;border:1px solid #e6ecef;border-radius:8px;background:#fff;color:#6d7c89;cursor:pointer; }
    .icon-button:hover { color:var(--sea-dark);background:#f6fbfb; }
    .icon-button svg { width:16px;height:16px; }
    .notification-dot { position:absolute;top:7px;right:7px;width:6px;height:6px;border:1.5px solid #fff;border-radius:50%;background:#d26c60; }
    .content { max-width:1540px;margin:0 auto;padding:27px 34px 46px; }
    .page-heading { display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:23px; }
    .eyebrow { margin:0 0 5px;color:#64818e;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase; }
    h1 { margin:0;color:#172c3b;font-size:25px;line-height:1.2;letter-spacing:-.045em;font-weight:650;text-wrap:balance; }
    .page-sub { margin:7px 0 0;color:#71818d;font-size:12px; }
    .heading-actions { display:flex;gap:8px;align-items:center; }
    .btn { display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:35px;padding:0 12px;border:1px solid #dfe7eb;border-radius:8px;color:#425968;background:#fff;cursor:pointer;font-size:11px;font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,box-shadow .15s; }
    .btn:hover { border-color:#c4d2d9;background:#f8fbfb; }
    .btn svg { width:14px;height:14px; }
    .btn-primary { border-color:var(--sea);color:#fff;background:var(--sea);box-shadow:0 2px 4px rgba(22,139,145,.14); }
    .btn-primary:hover { border-color:var(--sea-dark);color:#fff;background:var(--sea-dark); }
    .btn-dark { border-color:var(--navy);color:#fff;background:var(--navy); }
    .btn-dark:hover { color:#fff;background:#223b4d; }
    .btn-quiet { border-color:transparent;background:transparent;color:#617684; }
    .btn-quiet:hover { background:#f0f5f6; }
    .btn-small { min-height:29px;padding:0 9px;font-size:10px; }
    .btn:disabled { opacity:.48;cursor:not-allowed; }
    .card { border:1px solid rgba(221,230,234,.88);border-radius:var(--r-md);background:var(--paper);box-shadow:var(--shadow); }
    .card-pad { padding:17px 18px; }
    .section-head { display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 13px; }
    .section-head h2,.section-head h3 { margin:0;color:#203646;font-size:13px;font-weight:650;letter-spacing:-.018em; }
    .section-head p { margin:3px 0 0;color:#82909a;font-size:10px; }
    .text-link { display:inline-flex;align-items:center;gap:5px;padding:4px;border:0;color:var(--sea-dark);background:transparent;cursor:pointer;font-size:10px;font-weight:600; }
    .text-link:hover { color:#075d62; }
    .text-link svg { width:13px;height:13px; }
    .mini-label { color:#82919b;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase; }
    .muted { color:var(--muted); }
    .mono { font-variant-numeric:tabular-nums; }
    .kpi-grid { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px; }
    .kpi { position:relative;min-height:102px;padding:15px 16px;overflow:hidden; }
    .kpi:after { content:"";position:absolute;right:-17px;top:-20px;width:68px;height:68px;border-radius:50%;background:var(--tint,#edf7f6);opacity:.8; }
    .kpi-top { position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;color:#748490;font-size:10px;font-weight:600; }
    .kpi-top svg { width:16px;height:16px;color:var(--accent,var(--sea)); }
    .kpi-value { position:relative;z-index:1;margin-top:8px;color:#1c3242;font-size:22px;font-weight:680;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums; }
    .kpi-foot { position:relative;z-index:1;display:flex;align-items:center;gap:5px;margin-top:8px;color:#8996a0;font-size:9px; }
    .delta { color:#368464;font-weight:650; }
    .dashboard-top { display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,.85fr);gap:13px;margin-top:14px; }
    .field-activity { display:grid;grid-template-columns:1.05fr .95fr;gap:17px;align-items:center; }
    .activity-total { display:flex;gap:12px;align-items:center;padding:13px;border-radius:10px;background:#f2f8f8; }
    .ring { display:grid;place-items:center;position:relative;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--sea) 0 87.5%,#d9e8e7 87.5% 100%); }
    .ring:before { content:"";position:absolute;width:45px;height:45px;border-radius:50%;background:#f2f8f8; }
    .ring strong { position:relative;color:#1e5960;font-size:12px;font-weight:700; }
    .activity-total strong { display:block;color:#254352;font-size:12px; }
    .activity-total span { display:block;margin-top:3px;color:#81919a;font-size:10px; }
    .activity-list { display:flex;flex-direction:column;gap:11px; }
    .activity-person { display:grid;grid-template-columns:27px minmax(0,1fr) auto;gap:8px;align-items:center; }
    .activity-person .avatar { width:26px;height:26px;font-size:9px; }
    .activity-person strong { display:block;color:#344b5a;font-size:10px;font-weight:600; }
    .activity-person small { display:block;color:#94a0a8;font-size:9px; }
    .visit-count { color:#687b88;font-size:10px;font-variant-numeric:tabular-nums; }
    .progress { height:5px;margin-top:5px;overflow:hidden;border-radius:9px;background:#edf1f2; }
    .progress span { display:block;height:100%;border-radius:9px;background:var(--sea); }
    .urgent-list { display:flex;flex-direction:column;gap:0; }
    .urgent-row { display:grid;grid-template-columns:27px 1fr auto;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid #f0f3f4; }
    .urgent-row:last-child { border:0;padding-bottom:0; }
    .urgent-icon { display:grid;place-items:center;width:26px;height:26px;border-radius:8px;color:var(--warn,#a87729);background:var(--warn-bg,#fbf4e7); }
    .urgent-icon svg { width:14px;height:14px; }
    .urgent-row strong { display:block;color:#3a4f5c;font-size:10px;font-weight:600; }
    .urgent-row small { display:block;margin-top:2px;color:#8b99a2;font-size:9px; }
    .urgent-num { color:#4a5e6b;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums; }
    .dashboard-mid { display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.9fr);gap:13px;margin-top:13px; }
    .pipeline { display:grid;grid-template-columns:repeat(6,1fr);gap:10px; }
    .stage { min-width:0;padding:10px 9px;border-radius:9px;background:#f7f9fa; }
    .stage-label { display:flex;align-items:center;gap:6px;color:#788994;font-size:9px;font-weight:600;white-space:nowrap; }
    .stage-dot { width:6px;height:6px;border-radius:50%;background:var(--dot,var(--blue)); }
    .stage strong { display:block;margin-top:9px;color:#243949;font-size:15px;font-weight:680;font-variant-numeric:tabular-nums; }
    .stage small { display:block;margin-top:2px;color:#82909a;font-size:9px;white-space:nowrap; }
    .service-chart { display:grid;grid-template-columns:1fr 1fr;gap:8px 16px; }
    .bar-row { display:grid;grid-template-columns:82px 1fr 27px;gap:8px;align-items:center;color:#60727e;font-size:9px; }
    .bar-track { height:7px;overflow:hidden;border-radius:6px;background:#eef2f3; }
    .bar-track span { display:block;height:100%;border-radius:6px;background:var(--bar,var(--sea)); }
    .bar-value { text-align:right;color:#536976;font-size:9px;font-weight:650;font-variant-numeric:tabular-nums; }
    .dashboard-bottom { display:grid;grid-template-columns:minmax(0,1.45fr) minmax(240px,.65fr);gap:13px;margin-top:13px; }
    .activity-summary { display:grid;grid-template-columns:repeat(3,1fr);gap:9px; }
    .summary-stat { padding:11px 10px;border-radius:9px;background:#f7f9fa; }
    .summary-stat strong { display:block;color:#243a49;font-size:17px;line-height:1.1;font-weight:680;font-variant-numeric:tabular-nums; }
    .summary-stat span { display:block;margin-top:5px;color:#82909a;font-size:9px; }
    .summary-highlight { grid-column:span 3;display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-radius:9px;background:#edf7f5; }
    .summary-highlight span { color:#5d7d7d;font-size:10px; }
    .summary-highlight strong { color:#1d6e66;font-size:15px;font-weight:700; }
    .table-wrap { width:100%;overflow:auto; }
    table { width:100%;border-collapse:collapse;white-space:nowrap; }
    th { padding:9px 11px;color:#8997a1;background:#f8fafb;text-align:left;font-size:9px;font-weight:700;letter-spacing:.055em;text-transform:uppercase; }
    td { padding:11px;color:#556875;border-top:1px solid #edf1f2;font-size:10px; }
    tbody tr { transition:background .12s; }
    tbody tr:hover { background:#f8fbfb; }
    .click-row { cursor:pointer; }
    .company-name { color:#294252;font-size:10px;font-weight:650; }
    .cell-sub { display:block;margin-top:2px;color:#98a3aa;font-size:9px; }
    .tag { display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:20px;color:var(--tag-color,#53717e);background:var(--tag-bg,#f0f4f5);font-size:9px;font-weight:600; }
    .tag:before { content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7; }
    .tag.green { --tag-color:#25815d;--tag-bg:#eaf5ef; }
    .tag.blue { --tag-color:#4375b4;--tag-bg:#edf3fc; }
    .tag.amber { --tag-color:#a87525;--tag-bg:#fbf3e5; }
    .tag.red { --tag-color:#b5524c;--tag-bg:#fbefed; }
    .tag.purple { --tag-color:#725ca7;--tag-bg:#f1eef9; }
    .tag.teal { --tag-color:#1b777c;--tag-bg:#e9f6f5; }
    .tag.gray { --tag-color:#6e7f8a;--tag-bg:#f0f3f4; }
    .grid-2 { display:grid;grid-template-columns:1fr 1fr;gap:13px; }
    .grid-3 { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px; }
    .toolbar { display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid #edf1f2; }
    .control { height:32px;min-width:128px;padding:0 9px;border:1px solid #e2e9ec;border-radius:7px;color:#576c79;background:#fff;font-size:10px; }
    .control.search-control { min-width:200px;flex:1; }
    .tabs { display:flex;gap:4px;align-items:center;padding:4px;border-radius:9px;background:#f1f5f6; }
    .tab { min-height:29px;padding:0 11px;border:0;border-radius:7px;color:#71818c;background:transparent;cursor:pointer;font-size:10px;font-weight:600; }
    .tab:hover { color:#385666; }
    .tab.active { color:#29565d;background:#fff;box-shadow:0 1px 3px rgba(21,50,62,.1); }
    .field-card { position:relative;padding:16px;cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s; }
    .field-card:hover { transform:translateY(-2px);border-color:#cad9dd;box-shadow:0 8px 24px rgba(25,57,69,.075); }
    .route-head { display:flex;align-items:flex-start;justify-content:space-between;gap:10px; }
    .route-index { display:grid;place-items:center;flex:none;width:27px;height:27px;border-radius:8px;color:#197b7d;background:#e8f4f2;font-size:10px;font-weight:700; }
    .field-card h3 { margin:0;color:#263c4b;font-size:13px;letter-spacing:-.02em;font-weight:650; }
    .field-card .business-type { margin-top:3px;color:#87949c;font-size:10px; }
    .field-meta { display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;margin:14px 0 12px;padding:12px 0;border-top:1px solid #edf1f2;border-bottom:1px solid #edf1f2; }
    .field-meta span { display:block;color:#8e9ba3;font-size:9px; }
    .field-meta strong { display:block;margin-top:3px;color:#536875;font-size:10px;font-weight:600; }
    .service-pills { display:flex;gap:5px;flex-wrap:wrap; }
    .service-pill { padding:4px 7px;border-radius:5px;color:#477077;background:#eff7f6;font-size:9px;font-weight:550; }
    .field-bottom { display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px; }
    .field-bottom .btn { min-height:30px; }
    .card-actions { display:flex;align-items:center;gap:5px; }
    .subtle-icon { display:grid;place-items:center;width:29px;height:29px;border:1px solid #e7edef;border-radius:7px;color:#71828d;background:#fff;cursor:pointer; }
    .subtle-icon:hover { color:var(--sea-dark);background:#f2f9f8; }
    .subtle-icon svg { width:13px;height:13px; }
    .field-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px; }
    .territory { display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:15px 18px;margin-bottom:13px; }
    .territory h3 { margin:0;color:#2d4555;font-size:12px;font-weight:650; }
    .territory p { margin:4px 0 0;color:#84939c;font-size:10px; }
    .area-pills { display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end; }
    .area-pill { padding:6px 9px;border:1px solid #e5ecee;border-radius:7px;color:#6d818c;background:#fff;font-size:9px; }
    .area-pill.active { border-color:#b7dcda;color:#1b7477;background:#eff8f7;font-weight:650; }
    .pipeline-board { display:grid;grid-template-columns:repeat(6,minmax(175px,1fr));gap:10px;overflow:auto;padding-bottom:9px; }
    .kanban-col { min-height:400px;padding:10px;border-radius:11px;background:#eef3f4; }
    .kanban-head { display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 3px 10px; }
    .kanban-head strong { color:#425b69;font-size:10px;font-weight:650; }
    .kanban-head span { display:grid;place-items:center;width:21px;height:21px;border-radius:6px;color:#6c7f8b;background:#fff;font-size:9px;font-weight:650; }
    .opp-card { margin-top:8px;padding:12px;border:1px solid #e2e9ec;border-radius:9px;background:#fff;box-shadow:0 1px 2px rgba(18,41,54,.035);cursor:pointer;transition:transform .14s,box-shadow .14s; }
    .opp-card:hover { transform:translateY(-2px);box-shadow:0 7px 17px rgba(18,41,54,.09); }
    .opp-card h4 { margin:0;color:#324a59;font-size:10px;font-weight:650; }
    .opp-service { margin-top:3px;color:#82919a;font-size:9px; }
    .opp-value { display:block;margin-top:11px;color:#1e6267;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums; }
    .opp-foot { display:flex;align-items:center;justify-content:space-between;gap:7px;margin-top:11px;padding-top:9px;border-top:1px solid #eff2f3;color:#82919a;font-size:9px; }
    .opp-owner { display:flex;align-items:center;gap:5px; }
    .opp-owner .avatar { width:19px;height:19px;font-size:7px; }
    .alert-banner { display:flex;align-items:center;gap:10px;padding:11px 13px;margin-bottom:13px;border:1px solid #f0dfbd;border-radius:10px;color:#846128;background:#fff9ed;font-size:10px; }
    .alert-banner svg { width:15px;height:15px;flex:none; }
    .alert-banner strong { color:#6c4c18; }
    .alert-banner .btn { margin-left:auto; }

    function companyOverview(p,opps){ const used=p.used.length?p.used:['CCTV','Network']; const potential=p.potential.length?p.potential:['Annual IT AMC','ERP','Printer Maintenance','Website / Email']; return `<div class="detail-grid"><section class="card card-pad">${cardHead('Company overview','People, service needs and ownership')}<div class="key-value"><div><span>Primary contact</span><strong>${esc(p.contact)}</strong></div><div><span>Phone / WhatsApp</span><strong>${esc(p.phone)}</strong></div><div><span>Industry</span><strong>${esc(p.industry)}</strong></div><div><span>Area</span><strong>${esc(p.area)}, Jeddah</strong></div><div><span>Assigned staff</span><strong>${esc(p.assigned)}</strong></div><div><span>Lead source</span><strong>${esc(p.source)}</strong></div></div><div style="margin-top:18px"><div class="mini-label">Services currently used</div><div class="check-services">${used.map(s=>`<span class="tag green">${esc(s)}</span>`).join('')}</div></div><div class="cross-sell"><div class="cross-sell-head"><strong>Potential additional services</strong><span class="mini-label">Cross-sell</span></div><div class="cross-list">${potential.map(s=>`<div class="cross-item">${esc(s)}<button aria-label="Create ${esc(s)} opportunity" title="Create opportunity" data-action="cross-sell" data-service="${esc(s)}">+</button></div>`).join('')}</div></div></section><section class="card card-pad">${cardHead('What happens next?','Keep every customer conversation connected')}<div class="timeline">${[['30 Sep','Follow-up due','Revised CCTV quote · Ahmed'],['28 Sep','Quotation sent','QT-1042 · CCTV Upgrade'],['26 Sep','Site survey scheduled','8 cameras · 4TB storage'],['25 Sep','First field visit','Interested in CCTV and AMC'],['24 Sep','Company added','Source: field visit']].map((r,i)=>`<div class="timeline-item"><div class="timeline-date">${r[0]}</div><div class="timeline-mark"><i></i></div><div class="timeline-copy"><strong>${r[1]}</strong><span>${r[2]}</span></div></div>`).join('')}</div><div style="margin-top:7px"><button class="text-link" data-company-tab="Timeline">Full timeline ${icon('arrow',12)}</button></div></section></div><section class="card card-pad" style="margin-top:13px">${cardHead('Open opportunities',`${opps.length||3} service conversations tied to this company`,btn('Add opportunity','new-opportunity','btn-primary btn-small','plus'))}<div class="grid-3">${(opps.length?opps:seed.opportunities.slice(0,3)).slice(0,3).map(o=>miniOpp(o)).join('')}</div></section>`; }

    function teamPage(){const team=[{n:'Ahmed',assigned:42,visited:31,interested:15,quotes:9,won:4,sales:42500,conversion:'12.9%',overdue:2},{n:'Ali',assigned:37,visited:28,interested:12,quotes:8,won:3,sales:31000,conversion:'10.7%',overdue:3},{n:'Omar',assigned:45,visited:36,interested:18,quotes:11,won:5,sales:58200,conversion:'13.9%',overdue:2}];return `${heading('Field performance','Sales Team','Measure the field activity that creates opportunities, quotations and won revenue.',`<button class="btn" data-action="team-period">This month⌄</button>`)}<div class="grid-3">${team.map(t=>`<article class="card team-card"><div class="team-top"><div class="avatar">${initials(t.n)}</div><div><strong>${t.n}</strong><span>Field Sales · Jeddah</span></div>${tag('Active','green')}</div><div class="team-stats"><div><span>Companies assigned</span><strong>${t.assigned}</strong></div><div><span>Visited</span><strong>${t.visited}</strong></div><div><span>Interested</span><strong>${t.interested}</strong></div><div><span>Quotations</span><strong>${t.quotes}</strong></div><div><span>Won</span><strong>${t.won}</strong></div><div><span>Conversion</span><strong>${t.conversion}</strong></div></div><div class="team-sales"><span>Sales generated</span><strong>${money(t.sales)}</strong></div><div style="display:flex;justify-content:space-between;margin-top:10px;color:#86949d;font-size:9px"><span>${t.overdue} overdue follow-ups</span><button class="text-link" data-action="staff-detail" data-staff="${t.n}">View activity ${icon('arrow',11)}</button></div></article>`).join('')}</div><section class="card card-pad" style="margin-top:13px">${cardHead('Team activity comparison','Visits create opportunities; follow-through creates sales. This month to date.')}<div class="reports-layout"><div class="report-bars">${[['Visits',72],['Opportunities',46],['Quotes sent',37],['Deals won',23]].map((x,i)=>`<div class="report-bar"><span>${x[0]}</span><div class="bar-track"><span style="width:${x[1]}%;--bar:${['#168b91','#599da0','#719eac','#3c916e'][i]}"></span></div><strong>${[95,45,28,12][i]}</strong></div>`).join('')}</div><div class="report-bars">${team.map((t,i)=>`<div class="report-bar"><span>${t.n} · sales</span><div class="bar-track"><span style="width:${[73,53,100][i]}%;--bar:${i===1?'#76aaa8':'#168b91'}"></span></div><strong>${(t.sales/1000).toFixed(1)}k</strong></div>`).join('')}</div></div></section>`;}
    function reportsPage(){return `${heading('Management insight','Reports','See which sources, services and Jeddah areas turn field activity into sales.',`<button class="btn" data-action="report-period">${icon('calendar',13)} Sep 2026⌄</button>${btn('Export report','export-report','','download')}`)}<div class="reports-layout"><section class="card card-pad">${cardHead('Lead source','48 new prospects added this month')}<div class="report-bars">${[['Field Visit',78],['WhatsApp',44],['Referral',58],['Website',29],['Existing Customer',36],['Meta Ads',18]].map((x,i)=>`<div class="report-bar"><span>${x[0]}</span><div class="bar-track"><span style="width:${x[1]}%;--bar:${i===0?'#168b91':'#79b8b3'}"></span></div><strong>${[24,8,7,4,3,2][i]}</strong></div>`).join('')}</div></section><section class="card card-pad">${cardHead('Sales by service','Won value · this month')}<div class="report-bars">${[['CCTV',68],['IT AMC',42],['Networking',50],['Villa Automation',84],['ERP',35],['Hardware',26]].map((x,i)=>`<div class="report-bar"><span>${x[0]}</span><div class="bar-track"><span style="width:${x[1]}%;--bar:${i===3?'#7760ad':'#78aaa9'}"></span></div><strong>${['31k','18k','23k','42k','16k','11k'][i]}</strong></div>`).join('')}</div></section><section class="card card-pad">${cardHead('Area performance','Prospects through won business')}<div class="table-wrap"><table><thead><tr><th>Jeddah area</th><th>Prospects</th><th>Visited</th><th>Interested</th><th>Won</th><th>Sales value</th></tr></thead><tbody>${[['Al Rawdah',38,29,14,5,42500],['Al Salamah',27,21,10,3,28600],['Al Zahra',22,16,8,2,19200],['Al Hamra',31,23,12,4,35400],['Industrial Area',44,34,17,6,51200]].map(x=>`<tr><td class="company-name">${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td><td>${money(x[5])}</td></tr>`).join('')}</tbody></table></div></section><section class="card card-pad">${cardHead('Lost reasons','12 opportunities closed without a sale')}<div class="loss-list">${[['Price',5],['No Requirement',2],['Existing Supplier',2],['No Response',1],['Postponed',1],['Competitor',1]].map((x,i)=>`<div class="loss-line"><span>${x[0]}</span><div class="bar-track"><span style="width:${x[1]*18}%;--bar:${i===0?'#c5786d':'#d2aaa2'}"></span></div><strong>${x[1]}</strong></div>`).join('')}</div></section></div><div class="form-note" style="margin-top:13px">Area coverage is based on company records and logged visits. No GPS tracking or automatic prospect scraping is included.</div>`;}
    function showToast(msg){toastRegion.innerHTML=`<div class="toast">${icon('check',15)}<span>${esc(msg)}</span></div>`;clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>toastRegion.innerHTML='',3200);}
    function openModal(title,subtitle,body,actions='',wide=false){modalRoot.innerHTML=`<div class="modal-backdrop" data-close-modal><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><h2 id="modalTitle">${title}</h2><p>${subtitle||''}</p></div><button class="modal-close" data-close-modal aria-label="Close dialog">${icon('close',15)}</button></div>${body}<div class="modal-foot">${actions||'<span></span><button class="btn" data-close-modal>Close</button>'}</div></section></div>`;modalRoot.querySelector('.modal')?.focus();document.body.style.overflow='hidden';const f=modalRoot.querySelector('input,select,textarea,button');if(f)setTimeout(()=>f.focus(),20);}
    function closeModal(){modalRoot.innerHTML='';document.body.style.overflow='';}
    function field(label,control,full=false){return `<div class="form-field ${full?'full':''}"><label>${label}</label>${control}</div>`;}
    function select(name,options,value=''){return `<select name="${name}">${options.map(o=>`<option ${o===value?'selected':''}>${o}</option>`).join('')}</select>`;}
    function startVisit(company){const p=companyRecord(company);openModal('Record field visit',`Log the conversation at ${esc(company)} and decide the next action.`, `<div class="modal-body"><div class="form-grid">${field('Company',`<input name="company" value="${esc(company)}" readonly>`)}${field('Contact person met',`<input name="contact" value="${esc(p.contact)}">`)}${field('Services discussed',`<input name="services" value="CCTV, Annual IT Maintenance" placeholder="CCTV, Network, AMC">`)}${field('Interest level',select('interest',['High','Medium','Low'],'High'))}${field('Outcome',select('outcome',['Interested','Site Survey Required','Quotation Requested','Follow-up Later','Not Interested','Could Not Meet'],'Site Survey Required'))}${field('Next action',select('nextAction',['Schedule site survey','Prepare quotation','Call customer','Visit again','Close as not interested'],'Schedule site survey'))}${field('Next follow-up date',`<input name="followDate" type="date" value="2026-10-02">`)}${field('Visit notes',`<textarea name="notes" placeholder="What did the customer ask for?">Customer requested CCTV options and an annual maintenance proposal.</textarea>`,true)}</div></div>`, `<button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" data-submit="complete-visit">${icon('check',14)} Complete Visit</button>`);}
    function addProspect(){openModal('Add a company prospect','Capture the company, a real contact and the next field action.',`<div class="modal-body"><div class="form-grid">${field('Company name','<input name="company" placeholder="e.g. Jeddah Star Contracting" required>')}${field('Industry',select('industry',['Trading','Restaurant','Healthcare','Construction','Logistics','Residential','Other']))}${field('Area',select('area',['Al Rawdah','Al Salamah','Al Zahra','Al Hamra','Industrial Area','Al Safa']))}${field('Primary contact','<input name="contact" placeholder="Contact person">')}${field('Mobile / WhatsApp','<input name="phone" placeholder="+966 5X XXX XXXX">')}${field('Potential service',select('service',['CCTV','IT AMC','Network','Network AMC','Villa Automation','ERP','Hardware Supply','Printer Maintenance']))}${field('Assigned staff',select('assigned',['Ahmed','Ali','Omar']))}${field('Next action',select('next',['Plan first visit','Call contact','Send introduction']))}${field('Notes','<textarea name="notes" placeholder="Business context or service requirement"></textarea>',true)}</div></div>`,`<button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" data-submit="save-prospect">${icon('plus',14)} Save prospect</button>`);}
    function importProspects(){openModal('Import prospects','Bring known company records into the field plan.',`<div class="modal-body"><p style="margin:0 0 14px;color:#667b86;font-size:11px">Prepare a structured list, then review and assign it before your team visits.</p><div class="grid-2">${[['Excel / CSV','Upload a reviewed company list'],['Existing customer list','Identify additional service needs'],['Business directory','Enter selected companies manually'],['Marketing research','Add qualified area prospects']].map(x=>`<div class="card" style="padding:12px;box-shadow:none"><strong style="color:#395361;font-size:10px">${x[0]}</strong><p style="margin:4px 0 0;color:#88969f;font-size:9px">${x[1]}</p></div>`).join('')}</div><p class="form-note" style="margin-top:13px">Prospects are entered from information you already have. This demo does not scrape directories automatically.</p></div>`,'<button class="btn" data-close-modal>Close</button><button class="btn btn-primary" data-submit="import-demo">Choose a sample list</button>');}
    function openOpportunity(id){const o=data.opportunities.find(x=>x.id===id)||data.opportunities[0];state.oppId=o.id;openModal(esc(o.name),`${esc(o.company)} · ${esc(o.id)} · ${esc(o.service)}`,`<div class="modal-body"><div class="form-grid">${field('Company',`<input value="${esc(o.company)}" readonly>`)}${field('Opportunity name',`<input name="name" value="${esc(o.name)}">`)}${field('Service',select('service',['CCTV','IT AMC','Network','Villa Automation','ERP','Hardware','Printer Maintenance'],o.service))}${field('Estimated value',`<input name="value" type="number" value="${o.value}">`)}${field('Assigned sales staff',select('owner',['Ahmed','Ali','Omar'],o.owner))}${field('Stage',select('stage',['New Lead','Survey Required','Quotation','Follow-up','Negotiation','Won'],o.stage))}${field('Confidence',select('prob',['25%','35%','45%','55%','65%','75%','90%','100%'],`${o.prob}%`))}${field('Next follow-up',`<input name="follow" value="${esc(o.follow)}">`)}${field('Next action',select('nextAction',['Call customer','Schedule site survey','Prepare quotation','Follow up quotation','Revise proposal','Convert to project'],o.stage==='Won'?'Convert to project':'Follow up quotation'))}${field('Notes',`<textarea name="notes">${esc(o.note)}</textarea>`,true)}${field('Related survey',`<input value="${esc(o.survey||'Not linked')}" readonly>`)}${field('Related quotation',`<input value="${esc(o.quote||'Not created')}" readonly>`)}</div></div>`,`<button class="btn" data-close-modal>Close</button><span style="display:flex;gap:7px">${o.stage!=='Won'?`<button class="btn" data-action="create-quote-for-opp" data-opp="${o.id}">${icon('file',13)} Create quotation</button><button class="btn btn-primary" data-submit="save-opportunity">Save changes</button>`:`<button class="btn btn-primary" data-action="convert-project" data-opp="${o.id}">Convert to project ${icon('arrow',13)}</button>`}</span>`);}
    function surveyModal(template='CCTV Survey',survey=null){const s=survey||{company:template==='Villa Automation'?'Al Noor Villa':'ABC Trading LLC'};let details=template==='CCTV Survey'?`${field('Indoor cameras','<input name="indoor" type="number" value="2">')}${field('Outdoor cameras','<input name="outdoor" type="number" value="6">')}${field('NVR / DVR','<input name="nvr" value="8-channel NVR">')}${field('Storage requirement','<input name="storage" value="4TB">')}${field('Cabling required',select('cabling',['Yes','No'],'Yes'))}${field('Monitor required',select('monitor',['Yes','No'],'No'))}${field('Remote viewing',select('remote',['Required','Not required'],'Required'))}${field('Customer request','<input name="request" value="Phone viewing for owner">')}`:template==='Network Survey'?`${field('Number of computers','<input name="computers" type="number" value="18">')}${field('Network points','<input name="points" type="number" value="24">')}${field('Switches','<input name="switches" value="2 × 24 port">')}${field('Wi-Fi access points','<input name="aps" type="number" value="4">')}${field('Server / firewall','<input name="server" value="Existing server">')}${field('Cabling and rack','<input name="rack" value="New rack required">')}${field('Current network issues','<textarea name="issues">Wi-Fi coverage in rear offices</textarea>',true)}`:`${field('Villa size','<input name="size" value="420 sqm">')}${field('Floors / rooms','<input name="rooms" value="3 floors · 8 rooms">')}${field('Estimated budget','<input name="budget" value="SAR 30,000–35,000">')}${field('Customer priorities','<input name="priority" value="Lighting, curtains, AC">')}${field('Checklist',`<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;color:#617581;font-size:9px">${['Smart Lighting','Smart Curtains','Alexa / Voice Control','Smart AC','CCTV','Door Access','Smart Switches','Intercom','Wi-Fi','Home Theatre'].map(x=>`<label style="font-size:9px;font-weight:500"><input type="checkbox" ${[     function completeFollowup(id){const f=data.followups.find(x=>x.id===id);if(!f)return;openModal('Complete follow-up',`${esc(f.company)} · ${esc(f.opp)} · Assigned to ${esc(f.owner)}`,`<div class="modal-body"><div class="form-grid">${field('Contacted by',select('channel',['Phone','WhatsApp','Visit','Email'],'Phone'))}${field('Outcome',select('outcome',['No Answer','Call Later','Interested','Quotation Requested','Negotiating','Won','Lost'],'Interested'))}${field('Notes',`<textarea name="notes">${esc(f.note)}</textarea>`,true)}${field('Next follow-up',`<input name="next" type="date" value="2026-10-02">`)}${field('Assign to',select('owner',['Ahmed','Ali','Omar'],f.owner))}</div></div>`,`<button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" data-submit="save-followup">${icon('check',14)} Save follow-up</button>`);state.activeFollow=id;}
    function quoteDetail(id){const q=data.quotes.find(x=>x.id===id)||data.quotes[0];openModal(`Quotation ${esc(q.id)}`,`${esc(q.company)} · ${esc(q.service)} · Revision ${q.rev}`,`<div class="modal-body"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:13px"><div><div class="mini-label">Customer proposal</div><strong style="display:block;margin-top:4px;color:#2b4656;font-size:12px">${esc(q.company)}</strong></div>${statusPill(q.status)}</div><div class="quote-lines">${q.items.map((i,n)=>`<div class="quote-line"><span>${n+1}. ${esc(i)}</span><strong>${money([2400,1800,1050,2250,1000][n]||650)}</strong></div>`).join('')}</div><div class="quote-total"><div><span>Subtotal</span><strong>${money(Math.round(q.amount/1.15))}</strong></div><div><span>VAT 15%</span><strong>${money(q.amount-Math.round(q.amount/1.15))}</strong></div><div><span>Total</span><strong>${money(q.amount)}</strong></div></div><div class="form-note" style="margin-top:14px">Sent ${esc(q.sent)} · Quotation age: ${esc(q.age)} · Next follow-up: ${esc(q.next)}</div><div style="margin-top:14px"><div class="mini-label">Revision history</div><div style="display:flex;gap:8px;margin-top:7px">${Array.from({length:q.rev},(_,i)=>`<span class="tag ${i===q.rev-1?'teal':'gray'}">Revision ${i+1}${i===q.rev-1?' · Current':''}</span>`).join('')}</div></div></div>`,`<button class="btn" data-close-modal>Close</button><span style="display:flex;gap:7px"><button class="btn" data-action="revise-quote" data-quote="${q.id}">Create Revision</button><button class="btn btn-primary" data-action="quote-to-opportunity" data-quote="${q.id}">Open opportunity ${icon('arrow',13)}</button></span>`,true);}
    function newQuote(oppId){let o=data.opportunities.find(x=>x.id===oppId)||data.opportunities.find(x=>x.id===state.oppId)||data.opportunities[0];openModal('Create quotation',`${esc(o.company)} · ${esc(o.name)} · Prepare a price proposal.`, `<div class="modal-body"><div class="form-grid">${field('Company',`<input value="${esc(o.company)}" readonly>`)}${field('Opportunity',`<input value="${esc(o.name)}" readonly>`)}${field('Service',`<input name="service" value="${esc(o.service)}">`)}${field('Quotation amount (SAR)',`<input type="number" name="amount" value="${o.value}">`)}${field('Salesperson',select('owner',['Ahmed','Ali','Omar'],o.owner))}${field('Status',select('status',['Draft','Sent','Follow-up'],'Draft'))}${field('Items',`<textarea name="items">8 CCTV cameras\nNVR\n4TB hard disk\nCabling and installation\nConfiguration and remote viewing</textarea>`,true)}<div class="form-note form-field full">VAT is included in this demo total. A PDF can be attached in a connected implementation.</div></div></div>`,`<button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" data-submit="save-quote">Create quotation ${icon('arrow',13)}</button>`);state.quoteOppId=o.id;}

    function newFollowup(){openModal('Schedule a follow-up','Create a dated next action connected to a company opportunity.',`<div class="modal-body"><div class="form-grid">${field('Company',select('company',data.prospects.map(p=>p.company),'ABC Trading LLC'))}${field('Opportunity',select('opp',data.opportunities.map(o=>o.name),'CCTV Upgrade'))}${field('Assigned staff',select('owner',['Ahmed','Ali','Omar'],'Ahmed'))}${field('Due date','<input name="due" type="date" value="2026-10-02">')}${field('Reminder type',select('channel',['Phone','WhatsApp','Visit','Email']))}${field('Next action','<input name="action" value="Call customer about quotation">')}${field('Note','<textarea name="notes" placeholder="Context for the next conversation"></textarea>',true)}</div></div>`,`<button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" data-submit="save-new-followup">Schedule follow-up</button>`);}
    function projectDetail(id){const p=data.projects.find(x=>x.id===id)||data.projects[0];openModal(esc(p.name),`${esc(p.id)} · ${esc(p.company)} · ${money(p.value)}`,`<div class="modal-body"><div class="key-value"><div><span>Assigned team</span><strong>${esc(p.manager)}</strong></div><div><span>Current stage</span><strong>${esc(p.stage)}</strong></div><div><span>Start date</span><strong>${esc(p.start)}</strong></div><div><span>Expected completion</span><strong>${esc(p.due)}</strong></div></div><div style="margin-top:20px"><div class="mini-label">Delivery progress · ${p.progress}%</div><div class="progress" style="height:8px;margin-top:8px"><span style="width:${p.progress}%"></span></div></div><div class="check-services" style="margin-top:17px">${['Site Survey','Design','Material','Installation','Configuration','Testing','Handover'].map((x,i)=>tag(x,i<3?'green':i===3?'purple':'gray')).join('')}</div><p class="form-note" style="margin-top:15px">Simple delivery visibility keeps sales informed after the customer accepts.</p></div>`,`<button class="btn" data-close-modal>Close</button><button class="btn btn-primary" data-action="advance-project" data-project="${p.id}">Advance stage ${icon('arrow',13)}</button>`);}
    function handleAction(action,el){const company=el.dataset.company||state.company;switch(action){case'add-prospect':addProspect();break;case'import-prospects':importProspects();break;case'start-visit':startVisit(company);break;case'call':showToast(`Call ${companyRecord(company).contact} at ${companyRecord(company).phone}`);break;case'directions':showToast(`Area directions: ${companyRecord(company).area}, Jeddah`);break;case'open-company':openCompanyFromClick(company);break;case'new-opportunity':newQuoteOpportunity();break;case'new-followup':newFollowup();break;case'complete-followup':completeFollowup(el.dataset.follow);break;case'new-survey':surveyModal(el.dataset.template||'CCTV Survey');break;case'open-survey':surveyModal(data.surveys.find(s=>s.id===el.dataset.survey)?.type||'CCTV Survey',data.surveys.find(s=>s.id===el.dataset.survey));break;case'create-quote':newQuote(state.oppId);break;case'create-quote-for-opp':newQuote(el.dataset.opp);break;case'revise-quote':{const q=data.quotes.find(x=>x.id===el.dataset.quote);if(q){q.rev++;q.status='Revised';showToast(`${q.id} revised to revision ${q.rev}`);closeModal();render();}break;}case'quote-to-opportunity':{const q=data.quotes.find(x=>x.id===el.dataset.quote);if(q){closeModal();openOpportunity(data.opportunities.find(o=>o.company===q.company)?.id||state.oppId)}break;}case'convert-project':convertProject(el.dataset.opp||state.oppId);break;case'choose-convert':{const o=data.opportunities.find(o=>o.stage!=='Won');o?convertProject(o.id):showToast('All visible opportunities are already won.');break;}case'open-project':projectDetail(el.dataset.project);break;case'advance-project':{const p=data.projects.find(x=>x.id===el.dataset.project);const ss=['Site Survey','Design','Material','Installation','Configuration','Testing','Handover'];if(p){let i=ss.indexOf(p.stage);p.stage=ss[Math.min(i+1,6)];p.progress=Math.min(100,p.progress+12);closeModal();render();showToast(`${p.name} moved to ${p.stage}`)}break;}case'cross-sell':newCrossSell(el.dataset.service);break;case'renewal':newRenewal(company);break;case'amc-expiring':showToast('Showing contracts with less than 30 days remaining.');break;case'cycle-ticket':{const t=data.tickets.find(x=>x.id===el.dataset.ticket);const ss=['New','Assigned','Technician Visit','In Progress','Waiting for Parts','Completed'];if(t){t.status=ss[(ss.indexOf(t.status)+1)%ss.length];render();showToast(`${t.id} status updated to ${t.status}`)}break;}case'export-report':case'export-quotes':showToast('Report prepared for this demo.');break;case'area-plan':showToast('Area coverage groups the visits planned for each Jeddah territory.');break;case'team-period':case'report-period':showToast('Showing September 2026 activity.');break;case'staff-detail':showToast(`${el.dataset.staff} activity is reflected in the team performance view.`);break;case'followups-overdue':state.followTab='Overdue';render();break;case'create-project':convertProject(state.oppId);break;case'new-ticket':openModal('Create service ticket','Record a maintenance request for an existing customer.',`<div class="modal-body"><div class="form-grid">${field('Customer',select('company',data.prospects.map(p=>p.company),'ABC Trading LLC'))}${field('Issue','<input name="issue" placeholder="Describe the issue">')}${field('Device / service','<input name="device" placeholder="Device or covered service">')}${field('Priority',select('priority',['Low','Medium','High']))}${field('Assigned technician',select('tech',['Technician A','Technician B','Technician C']))}${field('Notes','<textarea name="notes"></textarea>',true)}</div></div>`,`<button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" data-submit="save-ticket">Create ticket</button>`);break;case'new-amc':showToast('AMC setup panel is ready for a connected implementation.');break;}}
    function newQuoteOpportunity(){const p=companyRecord(state.company);openModal('Create an opportunity','Add a separate service requirement under the company record.',`<div class="modal-body"><div class="form-grid">${field('Company',select('company',data.prospects.map(p=>p.company),p.company))}${field('Opportunity name','<input name="name" placeholder="e.g. Annual IT AMC" required>')}${field('Service',select('service',['CCTV','IT AMC','Network','Villa Automation','ERP','Hardware','Printer Maintenance']))}${field('Estimated value (SAR)','<input name="value" type="number" value="15000">')}${field('Assigned staff',select('owner',['Ahmed','Ali','Omar'],p.assigned))}${field('Stage',select('stage',['New Lead','Survey Required','Quotation','Follow-up','Negotiation'],'New Lead'))}${field('Next follow-up','<input name="follow" type="date" value="2026-10-02">')}${field('Notes','<textarea name="notes"></textarea>',true)}</div></div>`,`<button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" data-submit="save-opportunity-new">Create opportunity</button>`);}
    function newCrossSell(service){openModal('Create cross-sell opportunity',`${esc(state.company)} · Add a new service conversation.`, `<div class="modal-body"><div class="form-grid">${field('Company',`<input value="${esc(state.company)}" readonly>`)}${field('Service',`<input name="service" value="${esc(service)}">`)}${field('Opportunity name',`<input name="name" value="${esc(service)}">`)}${field('Estimated value (SAR)','<input name="value" type="number" value="15000">')}${field('Assigned to',select('owner',['Ahmed','Ali','Omar'],'Ahmed'))}${field('Next action',select('next',['Call customer','Plan a visit','Prepare proposal']))}</div></div>`,`<button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" data-submit="save-cross-sell">Create opportunity</button>`);}
    function newRenewal(company){openModal('Create AMC renewal opportunity',`${esc(company)} · Carry contract value and expiry into a follow-up.`, `<div class="modal-body"><div class="form-grid">${field('Company',`<input value="${esc(company)}" readonly>`)}${field('Service',`<input name="service" value="Annual IT AMC renewal">`)}${field('Estimated value (SAR)','<input name="value" type="number" value="15000">')}${field('Assigned staff',select('owner',['Ahmed','Ali','Omar'],'Ahmed'))}${field('Renewal follow-up','<input type="date" value="2026-10-02">')}${field('Note','<textarea>Review scope and confirm renewal before expiry.</textarea>',true)}</div></div>`,`<button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" data-submit="save-cross-sell">Create renewal opportunity</button>`);}
    function bindFormSubmit(type){const form=modalRoot.querySelector('.modal');const get=n=>form.querySelector(`[name="${n}"]`)?.value||'';if(type==='complete-visit'){const company=get('company'),p=companyRecord(company),out=get('outcome');const visit=data.visits.find(v=>v.company===company&&!v.done);if(visit){visit.done=true;visit.outcome=out;}else data.visits.unshift({company,area:p.area,contact:get('contact'),business:p.business||p.industry,services:get('services').split(/[,;+]/).map(s=>s.trim()).filter(Boolean),assigned:p.assigned,priority:'High',time:'Now',outcome:out,done:true});p.contact=get('contact');p.status=out==='Not Interested'?'Not Interested':'Interested';p.last='30 Sep';p.next=get('followDate')?new Date(get('followDate')+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'2 Oct';if(company==='ABC Trading LLC'){let cctv=data.opportunities.find(o=>o.id==='OP-2041');if(cctv){cctv.stage='Survey Required';cctv.note=get('notes');}if(!data.opportunities.some(o=>o.company===company&&o.service==='IT AMC'))data.opportunities.push({id:'OP-2051',company,name:'Annual IT AMC',service:'IT AMC',value:15000,owner:p.assigned,stage:'Follow-up',follow:'2 Oct',prob:50,note:'Customer interested in annual IT maintenance.'});if(!data.followups.some(f=>f.company===company&&f.opp==='CCTV Upgrade'&&f.kind==='upcoming'))data.followups.unshift({id:'FU-105',company,opp:'CCTV Upgrade',owner:p.assigned,due:p.next,kind:'upcoming',note:'Follow up after survey and revised CCTV price.',contact:get('contact')});}closeModal();render();showToast(`Visit recorded for ${company}. ${out} · next follow-up ${p.next}.`);}
      else if(type==='save-prospect'){if(!get('company'))return showToast('Enter a company name first.');const p={id:`C${String(data.prospects.length+1).padStart(3,'0')}`,company:get('company'),industry:get('industry'),area:get('area'),contact:get('contact')||'Contact pending',phone:get('phone')||'—',service:get('service'),assigned:get('assigned'),status:'Assigned',last:'—',next:get('next'),source:'Manual Entry',business:get('industry'),used:[],potential:[get('service')]};data.prospects.unshift(p);closeModal();render();showToast(`${p.company} added to prospects.`);}
      else if(type==='import-demo'){closeModal();showToast('Sample source selected. Review company details before importing.');}
      else if(type==='save-opportunity'){const o=data.opportunities.find(x=>x.id===state.oppId);if(o){o.name=get('name');o.service=get('service');o.value=Number(get('value'));o.owner=get('owner');o.stage=get('stage');o.prob=parseInt(get('prob'))||o.prob;o.follow=get('follow');o.note=get('notes');}closeModal();render();showToast('Opportunity details saved.');}
      else if(type==='save-opportunity-new'||type==='save-cross-sell'){const company=get('company')||state.company;const service=get('service');const o={id:`OP-${2050+data.opportunities.length}`,company,name:get('name')||service,service,value:Number(get('value'))||15000,owner:get('owner')||'Ahmed',stage:get('stage')||'New Lead',follow:get('follow')||'2 Oct',prob:40,note:get('notes')||'New customer requirement.'};data.opportunities.push(o);const p=companyRecord(company);if(!p.potential.includes(service))p.potential.push(service);closeModal();state.page='opportunities';render();showToast(`${service} opportunity added to ${company}.`);}
      else if(type==='save-followup'){const f=data.followups.find(x=>x.id===state.activeFollow);if(f){f.kind='completed';f.due='30 Sep';f.note=get('notes');const outcome=get('outcome');if(outcome==='Won'){const o=data.opportunities.find(x=>x.company===f.company&&x.name===f.opp);if(o)o.stage='Won';}}closeModal();render();showToast('Follow-up outcome saved to the company timeline.');}
      else if(type==='save-new-followup'){const company=get('company');data.followups.unshift({id:`FU-${100+data.followups.length}`,company,opp:get('opp'),owner:get('owner'),due:'2 Oct',kind:'upcoming',note:get('notes')||get('action'),contact:companyRecord(company).contact});closeModal();render();showToast(`Follow-up scheduled for ${company}.`);}
      else if(type==='save-survey'){const company=get('company');let s=data.surveys.find(x=>x.company===company);if(s){s.status='Report pending';s.progress=100;s.date='30 Sep';}else data.surveys.unshift({id:'SV-093',company,type:'CCTV Survey',owner:'Ahmed',date:'30 Sep',status:'Report pending',progress:100});const o=data.opportunities.find(x=>x.id===state.oppId);if(o)o.survey=s?.id||'SV-093';closeModal();render();showToast(`Site survey saved for ${company}.`);}
      else if(type==='save-quote'){const o=data.opportunities.find(x=>x.id===state.quoteOppId)||data.opportunities[0];const q={id:`QT-${1043+data.quotes.length}`,company:o.company,service:get('service'),amount:Number(get('amount'))||o.value,owner:get('owner'),sent:'30 Sep',status:get('status')==='Draft'?'Follow-up':get('status'),age:'Today',next:'2 Oct',items:get('items').split('\n').filter(Boolean),rev:1};data.quotes.unshift(q);o.quote=q.id;o.stage='Quotation';o.follow='2 Oct';if(o.id==='OP-2041')o.stage='Quotation';closeModal();render();showToast(`${q.id} created · ${money(q.amount)}. Opportunity moved to quotation.`);}
      else if(type==='convert-project'){const id=state.convertOppId;const o=data.opportunities.find(x=>x.id===id);if(o){o.stage='Won';o.prob=100;let project={id:`PR-${303+data.projects.length}`,company:o.company,name:get('projectName'),value:Number(get('projectValue'))||o.value,manager:get('team'),stage:get('stage'),progress:get('stage')==='Material'?25:10,start:'30 Sep 2026',due:'20 Oct 2026',status:'In progress'};data.projects.unshift(project);const p=companyRecord(o.company);if(!p.used.includes(o.service))p.used.push(o.service);p.status='Converted';closeModal();state.page='projects';render();showToast(`${o.company} marked won. Project ${project.id} is ready for delivery.`);}}
      else if(type==='save-ticket'){data.tickets.unshift({id:`TK-${205+data.tickets.length}`,company:get('company'),issue:get('issue'),device:get('device'),tech:get('tech'),priority:get('priority'),status:'New',date:'30 Sep'});closeModal();render();showToast('Service ticket created.');}
    }
    function openCompanyFromClick(company){state.company=company;state.companyTab='Overview';state.page='companyDetail';document.getElementById('crumbPage').textContent=company;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page==='companies'));render();window.scrollTo({top:0,behavior:'smooth'});}
    function bindEvents(){
      document.getElementById('mainNav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)navTo(b.dataset.page)});
      content.addEventListener('click',e=>{
        const nav=e.target.closest('[data-nav]');if(nav){navTo(nav.dataset.nav);return}
        const tab=e.target.closest('[data-field-tab]');if(tab){state.fieldTab=tab.dataset.fieldTab;render();return}
        const ft=e.target.closest('[data-follow-tab]');if(ft){state.followTab=ft.dataset.followTab;render();return}
        const ct=e.target.closest('[data-company-tab]');if(ct){state.companyTab=ct.dataset.companyTab;render();return}
        const action=e.target.closest('[data-action]');if(action){handleAction(action.dataset.action,action);return}
        const opp=e.target.closest('[data-opp]');if(opp){openOpportunity(opp.dataset.opp);return}
        const quote=e.target.closest('[data-quote]');if(quote){quoteDetail(quote.dataset.quote);return}
        const comp=e.target.closest('[data-company]');if(comp){openCompanyFromClick(comp.dataset.company);return}
      });
      content.addEventListener('change',e=>{if(e.target.matches('[data-filter]')){state.filters[e.target.dataset.filter]=e.target.value;render()}});
      content.addEventListener('input',e=>{if(e.target.matches('[data-prospect-search]')){state.prospectSearch=e.target.value;const pos=e.target.selectionStart;render();const el=content.querySelector('[data-prospect-search]');el?.focus();el?.setSelectionRange(pos,pos)}if(e.target.matches('[data-company-search]')){state.companySearch=e.target.value;const pos=e.target.selectionStart;render();const el=content.querySelector('[data-company-search]');el?.focus();el?.setSelectionRange(pos,pos)}});
      modalRoot.addEventListener('click',e=>{if(e.target.matches('[data-close-modal]')){closeModal();return}const submit=e.target.closest('[data-submit]');if(submit){bindFormSubmit(submit.dataset.submit);return}const action=e.target.closest('[data-action]');if(action)handleAction(action.dataset.action,action)});
      document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalRoot.innerHTML)closeModal();if(e.key==='Tab'&&modalRoot.innerHTML){const els=[...modalRoot.querySelectorAll('button,input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled);if(els.length){if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}}});
      document.getElementById('menuToggle').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
      document.getElementById('alertButton').addEventListener('click',()=>{state.page='followups';state.followTab='Overdue';navTo('followups')});
      const search=document.getElementById('globalSearch'),searchInput=document.getElementById('globalSearchInput');search.addEventListener('click',()=>search.classList.add('is-open'));searchInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&searchInput.value.trim()){state.prospectSearch=searchInput.value;state.page='prospects';navTo('prospects');setTimeout(()=>{const i=content.querySelector('[data-prospect-search]');if(i)i.value=searchInput.value},10)}});
    }
    function init(){bindEvents();render();}
    init();
  })();
  </script>
</body>
</html>
